<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>
    <style>
        .u{
            border: 1px solid;
            height: 8vh;
            background-color:pink;
        }
        .header{
             border: 1px solid;
             height: 12vh;
             display: flex;
             background-color: bisque;
        }
        .logo{
            border: 1px solid;
            height: 12vh;
            flex: 1;

        }
        .nav{
            border: 1px solid;
            height: 12vh;
            flex: 1;
        }
        .lo{
            border: 1px solid;
            height: 12vh;
            flex: 1;
        }
        .v{
            border: 1px solid;
             height: 40vh;
             display: flex;
             background-color: rgb(230, 115, 222);
        }
        .e{
            
            border: 1px solid;
             height: 20vh;
             flex: 1;
             position: relative;
             top: 40%;
             left: 15%;
             background-color: rgb(17, 42, 70);
        }
        .g{
            
            border: 1px solid;
             height: 10vh;
             flex: 1;
             position: relative;
             top: 15%;
             right: 35%;
             background-color: rgb(75, 75, 143);
        }
        .f{
            
            border: 1px solid;
             height: 20vh;
             display: flex;
             padding: 20px;
             background-color: rgb(66, 129, 108);
             gap: 10px;
        }
        .cl1{
            
            border: 1px solid;
             height: 20vh;
             flex: 1;
             background-color: antiquewhite;
        }
        .cl2{
            background-color: antiquewhite;
            border: 1px solid;
             height: 20vh;
             flex: 1;
        }
        .j{
            
            border: 1px solid;
            height: 13vh;
            background-color: rgb(201, 87, 87);
        }
        .a{
            
            border: 1px solid;
            padding: 10px;
            width: 20px;
            position: relative;
            bottom: 150px;
            left: 40px;
            background-color: black;
        }
        .b{
            background-color: black;
            border: 1px solid;
            padding: 10px;
            width: 20px;
            position: relative;
            bottom: 172px;
            left: 90px;
        
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="u"></div>
        <div class="header">
            <div class="logo"></div>
            <div class="nav"></div>
            <div class="lo"></div>
        </div>
        <div class="v">
            <div class="e"></div>
            <div class="g"></div>
        </div>
        <div class="f">
            <div class="cl1"></div>
            <div class="cl2"></div>
        </div>
        <div class="j"></div>
        <div class="realtive">
            <div class="a"></div>
            <div class="b"></div>
        </div>
    </div>
</body>
</html>
